project:
  type: website
  render:
    - "*.qmd"
    - "!materials/*/exercises/"
  output-dir: docs
  resources:
    - "datasets/*/*.csv"
    - "materials/2-ml-session/*.R"
    - "materials/2-ml-session/*.csv"
    - "materials/3-bulk-rnaseq/*.R"
    - "materials/3-bulk-rnaseq/*.csv"
    - "materials/3-bulk-rnaseq/*.pptx"
    - "materials/3-bulk-rnaseq/*.txt"

from: markdown+emoji

website:
  bread-crumbs: false
  title: "Bioinformatics Series in Botswana"
  page-navigation: true
  navbar:
    background: light
    foreground: dark
    right:
      - text: "Installation"
        href: installation-instructions.qmd
      - text: "Datasets"
        href: datasets.qmd
      - text: "Resources"
        href: resources.qmd
      - text: "Past Workshops"
        href: past_workshops.qmd
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/elsherbini/durban-data-science-for-biology
        aria-label: GitHub
  sidebar:
      collapse-level: 1
    # - title: Materials
      style: docked
      align: left
      contents:
          - section: "<b>1. Welcome</b>"
            href: materials/1-welcome/index.qmd

          - section: "<b>2. Machine Learning</b>"
            href: materials/2-ml-session/index.qmd
            contents:
            - text: "Transcriptomic correlates of HIV/SIV rebound"
              href: materials/2-ml-session/index.qmd

          - section: "<b>3. Bulk RNA-Seq</b>"
            href: materials/3-bulk-rnaseq/index.qmd
            contents:
            - text: "DESeq2 and GSEA - Rebound vs NoRebound"
              href: materials/3-bulk-rnaseq/index.qmd

          - section: "<b>4. Introduction to Bioinformatics & AI</b>"
            href: materials/1-intro-bioinfo-ai/index.qmd
            contents:
            - text: "What is Bioinformatics?"
              href: materials/1-intro-bioinfo-ai/1-what-is-bioinformatics.qmd
            - text: "What is AI?"
              href: materials/1-intro-bioinfo-ai/2-what-is-ai.qmd
            - text: "Where They Meet"
              href: materials/1-intro-bioinfo-ai/3-where-they-meet.qmd
            - text: "<em>Exercise:</em> Match the Question to the Method"
              href: materials/1-intro-bioinfo-ai/exercise.qmd

          - section: "<b>5. AI and Application</b>"
            href: materials/2-ai-application/index.qmd
            contents:
            - text: "<b>Module 1</b>: Foundations of Machine Learning"
              href: materials/2-ai-application/1-foundations.qmd
            - text: "<b>Module 2</b>: Supervised Learning"
              href: materials/2-ai-application/2-supervised-learning.qmd
            - text: "<b>Module 3</b>: Unsupervised Learning"
              href: materials/2-ai-application/3-unsupervised-learning.qmd
            - text: "<b>Module 4</b>: Deep Learning & Sequence Models"
              href: materials/2-ai-application/4-deep-learning.qmd
            - text: "<b>Module 5</b>: LLMs in Research"
              href: materials/2-ai-application/5-llms-in-research.qmd

          - section: "<b>6. Bioinformatics & Application</b>"
            href: materials/3-bioinformatics-application/index.qmd
            contents:
            - text: "<b>Module 1</b>: Sequence Data & Quality Control"
              href: materials/3-bioinformatics-application/1-sequence-qc.qmd
            - text: "<b>Module 2</b>: Mapping & Variant Calling"
              href: materials/3-bioinformatics-application/2-mapping-variants.qmd
            - text: "<b>Module 3</b>: Genotyping & Recombination"
              href: materials/3-bioinformatics-application/3-genotyping.qmd
            - text: "<b>Module 4</b>: Phylogenetics"
              href: materials/3-bioinformatics-application/4-phylogenetics.qmd

          - section: "<b>7. Hands-On</b>"
            href: materials/4-hands-on/index.qmd
            contents:
            - text: "Case study: mtDNA haplogroups & HIV status"
              href: materials/4-hands-on/1-mtdna-case-study/index.qmd

          - section: "<b>8. Survey</b>"
            href: materials/5-survey/index.qmd
            contents:
            - text: "Post Survey"
              href: https://forms.cloud.microsoft/r/JZhhfcfmEz
              target: _blank
  page-footer:
    right: "This page is built with {{< fa heart >}} and [Quarto](https://quarto.org/)."
    left: "&copy; 2026. Dr. Choga WT"

format:   
  html:
    theme: [default, assets/custom.scss]
    toc: false
  

